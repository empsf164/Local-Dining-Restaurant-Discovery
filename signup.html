<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account — Crumb & Table</title>
  <meta name="description" content="Join Crumb & Table to discover artisan bakeries, save favorite places, and review local culinary destinations.">
  
  <!-- Favicon matching Navbar Brand Icon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <script src="assets/js/theme.js"></script>
</head>
<body class="d-flex flex-column min-vh-100 justify-content-center position-relative">

  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="container" style="max-width: 520px;">
      <div class="p-4 p-md-5 bg-surface rounded-5 border border-medium shadow-lg">
        
        <!-- Brand name and icon placed inside the box in top center -->
        <div class="text-center mb-4">
          <a class="navbar-brand navbar-brand-custom d-inline-flex align-items-center justify-content-center mb-3 text-decoration-none" href="index.html">
            <div class="brand-icon"><i class="bi bi-cup-hot-fill"></i></div>
            <div class="text-start">
              <span>CRUMB & TABLE</span>
              <span class="brand-tagline-subtle">Bakery & Confectionery Discovery</span>
            </div>
          </a>
          <h1 class="font-serif fw-bold fs-3 mb-1">Create an Account</h1>
          <p class="text-muted small mb-0">Join a community of local bread and dessert discoverers</p>
        </div>

        <form id="signupForm">
          <!-- Full Name -->
          <div class="mb-3">
            <label for="signupName" class="form-label small fw-bold">Full Name</label>
            <div class="input-group">
              <span class="input-group-text bg-secondary border-subtle"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control border-subtle" id="signupName" placeholder="Claire Vance" required>
            </div>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label for="signupEmail" class="form-label small fw-bold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-secondary border-subtle"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control border-subtle" id="signupEmail" placeholder="name@example.com" required>
            </div>
          </div>

          <!-- City Selection -->
          <div class="mb-3">
            <label for="signupCity" class="form-label small fw-bold">Preferred City / Neighborhood</label>
            <select class="form-select border-subtle" id="signupCity">
              <option value="Central City" selected>Central City (All Quarters)</option>
              <option value="Arts Quarter">Arts Quarter</option>
              <option value="Old Foundry">Old Foundry District</option>
              <option value="Golden Triangle">Golden Triangle</option>
              <option value="Westside Gardens">Westside Gardens</option>
            </select>
          </div>

          <!-- Password & Confirm with Eye Toggle -->
          <div class="row g-2 mb-3">
            <div class="col-sm-6">
              <label for="signupPassword" class="form-label small fw-bold">Password</label>
              <div class="input-group">
                <input type="password" class="form-control border-subtle" id="signupPassword" placeholder="••••••••" required>
                <button class="btn btn-outline-secondary border-subtle toggle-password-btn" type="button" data-target="signupPassword" aria-label="Toggle password visibility">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>
            <div class="col-sm-6">
              <label for="signupConfirmPassword" class="form-label small fw-bold">Confirm</label>
              <div class="input-group">
                <input type="password" class="form-control border-subtle" id="signupConfirmPassword" placeholder="••••••••" required>
                <button class="btn btn-outline-secondary border-subtle toggle-password-btn" type="button" data-target="signupConfirmPassword" aria-label="Toggle confirm password visibility">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Newsletter Opt-in -->
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="newsletterCheck" checked>
            <label class="form-check-label small text-secondary" for="newsletterCheck">Send me weekly curated bakery guides & new openings</label>
          </div>

          <!-- Terms -->
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="termsCheck" required checked>
            <label class="form-check-label small text-secondary" for="termsCheck">
              I agree to Crumb & Table discovery <a href="#" class="auth-link">terms</a> & <a href="#" class="auth-link">privacy policy</a>
            </label>
          </div>

          <button type="submit" class="btn btn-primary-custom w-100 py-3 fs-6 mb-3">
            Create Free Account
          </button>
        </form>

        <div class="text-center text-muted small my-3">or continue with</div>

        <!-- Google & Apple Social Login at Bottom -->
        <div class="row g-2 mb-4">
          <div class="col-6">
            <button class="btn btn-secondary-custom w-100 justify-content-center py-2 text-secondary" type="button"
              onclick="if(window.showToast) window.showToast('Google OAuth signup ready for backend connection', 'bi-google');">
              <i class="bi bi-google me-2 text-danger"></i> Google
            </button>
          </div>
          <div class="col-6">
            <button class="btn btn-secondary-custom w-100 justify-content-center py-2 text-secondary" type="button"
              onclick="if(window.showToast) window.showToast('Apple ID signup ready for backend connection', 'bi-apple');">
              <i class="bi bi-apple me-2"></i> Apple
            </button>
          </div>
        </div>

        <div class="text-center small text-secondary">
          Already have an account? <a href="login.html" class="auth-link fw-bold">Sign In</a>
        </div>
      </div>
    </div>
  </main>

  <button id="backToTopBtn" class="back-to-top-btn" aria-label="Back to top" title="Back to top">
    <i class="bi bi-arrow-up"></i>
  </button>

  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Toggle password eye icon visibility
      document.querySelectorAll(".toggle-password-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const targetId = btn.getAttribute("data-target");
          const input = document.getElementById(targetId);
          if (input) {
            const isPassword = input.type === "password";
            input.type = isPassword ? "text" : "password";
            const icon = btn.querySelector("i");
            if (icon) {
              icon.className = isPassword ? "bi bi-eye-slash" : "bi bi-eye";
            }
          }
        });
      });

      const form = document.getElementById("signupForm");
      if (form) {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const name = document.getElementById("signupName").value.trim();
          const email = document.getElementById("signupEmail").value.trim();
          const pass = document.getElementById("signupPassword").value;
          const confirmPass = document.getElementById("signupConfirmPassword").value;
          const city = document.getElementById("signupCity").value;

          if (pass !== confirmPass) {
            if (window.showToast) window.showToast("Passwords do not match. Please verify.", "bi-exclamation-triangle");
            return;
          }

          const user = AuthManager.signup(name, email, pass, city);
          if (window.showToast) window.showToast(`Account created! Welcome to Crumb & Table, ${user.name}!`, "bi-check-circle-fill");

          setTimeout(() => {
            window.location.href = "discover.html";
          }, 800);
        });
      }
    });
  </script>
</body>
</html>
