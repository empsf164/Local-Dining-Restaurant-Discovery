<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Your Password — Crumb & Table</title>
  <meta name="description" content="Reset your Crumb & Table account password.">
  
  <!-- Favicon matching Navbar Brand Icon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <script src="assets/js/theme.js"></script>
</head>
<body class="d-flex flex-column min-vh-100 justify-content-center position-relative">

  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="container" style="max-width: 460px;">
      <div class="p-4 p-md-5 bg-surface rounded-5 border border-medium shadow-lg" id="forgotCardContainer">
        
        <!-- Brand name and icon placed inside the box in top center -->
        <div class="text-center mb-4">
          <a class="navbar-brand navbar-brand-custom d-inline-flex align-items-center justify-content-center mb-3 text-decoration-none" href="index.html">
            <div class="brand-icon"><i class="bi bi-cup-hot-fill"></i></div>
            <div class="text-start">
              <span>CRUMB & TABLE</span>
              <span class="brand-tagline-subtle">Bakery & Confectionery Discovery</span>
            </div>
          </a>
        </div>

        <!-- Initial Form -->
        <div id="forgotFormState">
          <div class="text-center mb-4">
            <h1 class="font-serif fw-bold fs-3 mb-1">Reset Password</h1>
            <p class="text-muted small mb-0">Enter your email and we'll send you recovery instructions.</p>
          </div>

          <form id="forgotForm">
            <div class="mb-4">
              <label for="forgotEmail" class="form-label small fw-bold">Account Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-secondary border-subtle"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control border-subtle" id="forgotEmail" placeholder="name@example.com" required>
              </div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-3 fs-6 mb-3">
              Send Reset Link
            </button>
          </form>

          <div class="text-center text-muted small my-3">or continue with</div>

          <!-- Google & Apple Social Login at Bottom -->
          <div class="row g-2 mb-4">
            <div class="col-6">
              <button class="btn btn-secondary-custom w-100 justify-content-center py-2 text-secondary" type="button"
                onclick="if(window.showToast) window.showToast('Google recovery initialized', 'bi-google');">
                <i class="bi bi-google me-2 text-danger"></i> Google
              </button>
            </div>
            <div class="col-6">
              <button class="btn btn-secondary-custom w-100 justify-content-center py-2 text-secondary" type="button"
                onclick="if(window.showToast) window.showToast('Apple ID recovery initialized', 'bi-apple');">
                <i class="bi bi-apple me-2"></i> Apple
              </button>
            </div>
          </div>

          <div class="text-center small text-secondary">
            Remembered your password? <a href="login.html" class="text-terracotta fw-bold auth-link">Sign In</a>
          </div>
        </div>

        <!-- Success State -->
        <div id="forgotSuccessState" class="d-none text-center">
          <div class="d-inline-flex align-items-center justify-content-center rounded-circle p-3 bg-secondary text-success fs-2 mb-3">
            <i class="bi bi-envelope-check-fill"></i>
          </div>
          <h3 class="font-serif fw-bold fs-4 mb-2">Check Your Inbox</h3>
          <p class="text-secondary small mb-4">
            We've sent a password reset link to <strong id="sentEmailDisplay">your email</strong>. Please check your inbox and spam folder.
          </p>
          <a href="login.html" class="btn btn-secondary-custom w-100 py-2 auth-link">Back to Login</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Back to Top Floating Button -->
  <button id="backToTopBtn" class="back-to-top-btn" type="button" aria-label="Back to top" title="Back to top">
    <i class="bi bi-arrow-up"></i>
  </button>

  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("forgotForm");
      if (form) {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const email = document.getElementById("forgotEmail").value.trim();
          document.getElementById("sentEmailDisplay").textContent = email;
          document.getElementById("forgotFormState").classList.add("d-none");
          document.getElementById("forgotSuccessState").classList.remove("d-none");
          if (window.showToast) window.showToast("Reset link sent successfully!", "bi-check-circle-fill");
        });
      }
    });
  </script>
</body>
</html>
