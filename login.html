<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login to Crumb & Table — Local Food Discovery</title>
  <meta name="description"
    content="Sign in to your Crumb & Table account to keep your saved bakeries, favorite pastries, and reading list across devices.">

  <!-- Favicon matching Navbar Brand Icon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <script src="assets/js/theme.js"></script>
</head>

<body class="d-flex flex-column min-vh-100 justify-content-center position-relative">

  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="container" style="max-width: 460px;">
      <div class="p-4 p-md-5 bg-surface rounded-5 border border-medium shadow-lg">
        
        <!-- Brand name and icon placed inside the box in top center -->
        <div class="text-center mb-4">
          <a class="navbar-brand navbar-brand-custom d-inline-flex align-items-center justify-content-center mb-3 text-decoration-none" href="index.html">
            <div class="brand-icon"><i class="bi bi-cup-hot-fill"></i></div>
            <div class="text-start">
              <span>CRUMB & TABLE</span>
              <span class="brand-tagline-subtle">Bakery & Confectionery Discovery</span>
            </div>
          </a>
          <h1 class="font-serif fw-bold fs-3 mb-1">Welcome Back</h1>
          <p class="text-muted small mb-0">Sign in to sync your saved discoveries & write reviews</p>
        </div>

        <form id="loginForm">
          <!-- Email Input -->
          <div class="mb-3">
            <label for="loginEmail" class="form-label small fw-bold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-secondary border-subtle"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control border-subtle" id="loginEmail" placeholder="name@example.com"
                value="claire.patissier@example.com" required>
            </div>
          </div>

          <!-- Password Input -->
          <div class="mb-3">
            <label for="loginPassword" class="form-label small fw-bold">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-secondary border-subtle"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control border-subtle" id="loginPassword" value="password123" required>
              <button class="btn btn-outline-secondary border-subtle" type="button" id="togglePasswordBtn"
                aria-label="Toggle password visibility"><i class="bi bi-eye"></i></button>
            </div>
          </div>

          <!-- Remember Me and Forgot Password on the EXACT SAME LINE -->
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check mb-0">
              <input class="form-check-input" type="checkbox" id="rememberMeCheck" checked>
              <label class="form-check-label small text-secondary" for="rememberMeCheck">Remember me</label>
            </div>
            <a href="forgot-password.html" class="small text-terracotta text-decoration-none fw-semibold auth-link">Forgot password?</a>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary-custom w-100 py-3 fs-6 mb-3">
            Sign In to Crumb & Table
          </button>
        </form>

        <div class="text-center text-muted small my-3">or continue with</div>

        <!-- Google & Apple Social Login at Bottom -->
        <div class="row g-2 mb-4">
          <div class="col-6">
            <button class="btn btn-secondary-custom w-100 justify-content-center py-2 text-secondary" type="button"
              onclick="if(window.showToast) window.showToast('Google OAuth authentication ready for backend connection', 'bi-google');">
              <i class="bi bi-google me-2 text-danger"></i> Google
            </button>
          </div>
          <div class="col-6">
            <button class="btn btn-secondary-custom w-100 justify-content-center py-2 text-secondary" type="button"
              onclick="if(window.showToast) window.showToast('Apple ID authentication ready for backend connection', 'bi-apple');">
              <i class="bi bi-apple me-2"></i> Apple
            </button>
          </div>
        </div>

        <div class="text-center small text-secondary">
          Don't have an account? <a href="signup.html" class="text-terracotta fw-bold auth-link">Create Account</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Back to Top Floating Button -->
  <button id="backToTopBtn" class="back-to-top-btn" type="button" aria-label="Back to top" title="Back to top">
    <i class="bi bi-arrow-up"></i>
  </button>

  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Toggle password
      const toggleBtn = document.getElementById("togglePasswordBtn");
      const passInput = document.getElementById("loginPassword");
      if (toggleBtn && passInput) {
        toggleBtn.addEventListener("click", () => {
          const isPass = passInput.type === "password";
          passInput.type = isPass ? "text" : "password";
          toggleBtn.innerHTML = isPass ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
        });
      }

      // Login form submit
      const form = document.getElementById("loginForm");
      if (form) {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const email = document.getElementById("loginEmail").value.trim();
          const pass = document.getElementById("loginPassword").value;
          const remember = document.getElementById("rememberMeCheck").checked;

          const user = AuthManager.login(email, pass, remember);
          if (window.showToast) window.showToast(`Welcome back, ${user.name}!`, "bi-check2-circle");

          const urlParams = new URLSearchParams(window.location.search);
          const redirect = urlParams.get("redirect") || "index.html";

          setTimeout(() => {
            window.location.href = redirect;
          }, 600);
        });
      }
    });
  </script>
</body>

</html>
