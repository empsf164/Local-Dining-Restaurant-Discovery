<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login to Crumb & Table — Local Food Discovery</title>
  <meta name="description" content="Sign in to your Crumb & Table account to keep your saved bakeries, favorite pastries, and reading list across devices.">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <script src="assets/js/theme.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Minimal Header -->
  <header class="py-3 border-bottom border-subtle bg-surface">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand-custom" href="index.html">
        <div class="brand-icon"><i class="bi bi-cup-hot-fill"></i></div>
        <span>CRUMB & TABLE</span>
      </a>
      <a href="index.html" class="btn btn-sm btn-secondary-custom">&larr; Back to Home</a>
    </div>
  </header>

  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="container" style="max-width: 460px;">
      <div class="p-4 p-md-5 bg-surface rounded-5 border border-medium shadow-lg">
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center rounded-circle p-3 bg-secondary text-terracotta fs-3 mb-2">
            <i class="bi bi-person-circle"></i>
          </div>
          <h1 class="font-serif fw-bold fs-3 mb-1">Welcome Back</h1>
          <p class="text-muted small">Sign in to sync your saved discoveries & write reviews</p>
        </div>

        <form id="loginForm">
          <!-- Email Input -->
          <div class="mb-3">
            <label for="loginEmail" class="form-label small fw-bold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-secondary border-subtle"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control border-subtle" id="loginEmail" placeholder="name@example.com" value="claire.patissier@example.com" required>
            </div>
          </div>

          <!-- Password Input -->
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label for="loginPassword" class="form-label small fw-bold mb-0">Password</label>
              <a href="forgot-password.html" class="small text-terracotta text-decoration-none">Forgot password?</a>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-secondary border-subtle"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control border-subtle" id="loginPassword" value="password123" required>
              <button class="btn btn-outline-secondary border-subtle" type="button" id="togglePasswordBtn" aria-label="Toggle password visibility"><i class="bi bi-eye"></i></button>
            </div>
          </div>

          <!-- Remember Me -->
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="rememberMeCheck" checked>
            <label class="form-check-label small text-secondary" for="rememberMeCheck">Remember me on this device</label>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary-custom w-100 py-3 fs-6 mb-3">
            Sign In to Crumb & Table
          </button>
        </form>

        <div class="text-center text-muted small my-3">or continue with</div>

        <!-- Social login placeholders -->
        <div class="d-grid gap-2 mb-4">
          <button class="btn btn-secondary-custom justify-content-center py-2 text-secondary" type="button" onclick="if(window.showToast) window.showToast('Google OAuth authentication ready for backend connection', 'bi-google');">
            <i class="bi bi-google me-2 text-danger"></i> Continue with Google
          </button>
        </div>

        <div class="text-center small text-secondary">
          Don't have an account? <a href="signup.html" class="text-terracotta fw-bold">Create Account</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 border-top border-subtle text-center small text-muted">
    &copy; 2026 Crumb & Table Discovery Platform.
  </footer>

  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Toggle password
      const toggleBtn = document.getElementById("togglePasswordBtn");
      const passInput = document.getElementById("loginPassword");
      if (toggleBtn && passInput) {
        toggleBtn.addEventListener("click", () => {
          const isPass = passInput.type === "password";
          passInput.type = isPass ? "text" : "password";
          toggleBtn.innerHTML = isPass ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
        });
      }

      // Login form submit
      const form = document.getElementById("loginForm");
      if (form) {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const email = document.getElementById("loginEmail").value.trim();
          const pass = document.getElementById("loginPassword").value;
          const remember = document.getElementById("rememberMeCheck").checked;

          const user = AuthManager.login(email, pass, remember);
          if (window.showToast) window.showToast(`Welcome back, ${user.name}!`, "bi-check2-circle");

          const urlParams = new URLSearchParams(window.location.search);
          const redirect = urlParams.get("redirect") || "index.html";

          setTimeout(() => {
            window.location.href = redirect;
          }, 600);
        });
      }
    });
  </script>
</body>
</html>
